<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1f44">
<link rel="manifest" href="manifest.json">
<title>EduLynx</title>
<style>
:root{--navy:#0a1f44;--navy2:#17356f;--gold:#c29b40;--gold-d:#8a6a1f;--gold-soft:#f6efdc;--bg:#f4f6fa;--card:#fff;--tx:#0a1f44;--mut:#5b6679;--bd:#dde2ec;--soft:#eaeef6;--bad:#b42318;--ok:#12805c;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-weight:700;letter-spacing:.01em}
h1{font-size:28px;line-height:1.2;margin:4px 0 8px}
h2{font-size:20px;margin:22px 0 8px}
h3{font-size:17px;margin:0 0 4px}
.hero{background:var(--navy);color:#fff;padding:calc(28px + env(safe-area-inset-top,0px)) 22px 30px;border-bottom:4px solid var(--gold)}
.hero h1{color:#fff;font-size:34px;margin:12px 0 6px}
.hero p{margin:0;color:#c9d3ea;font-size:15px}
.hero .back{background:none;border:0;color:var(--gold);padding:0 0 6px;font-weight:600}
.bar{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;border-bottom:3px solid var(--gold);display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar .sch{font-family:Georgia,"Iowan Old Style",serif;font-size:19px;font-weight:700}
.bar .who{font-size:13px;color:#c9d3ea;margin-top:2px}
.bar .tag{background:var(--gold);color:var(--navy)}
.pg{padding:18px 18px 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:15px;margin:12px 0}
.card.ann{border-left:4px solid var(--gold)}
.card.alr{border-left:4px solid var(--bad)}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
button,input,select,textarea{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:12px;border:1px solid #c3cbdb;border-radius:8px;background:#fff;margin:6px 0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
button{border:0;border-radius:8px;padding:12px 16px;background:var(--navy);color:#fff;font-weight:600;cursor:pointer}
button.g{background:var(--soft);color:var(--navy)}
button.o{background:none;border:1px solid var(--gold);color:var(--gold);padding:8px 12px}
button.d{background:var(--bad);color:#fff}
button.w{width:100%}
.li{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:#fff;color:var(--navy);border:1px solid var(--bd);border-left:4px solid var(--gold);margin:8px 0;padding:16px;font-family:Georgia,"Iowan Old Style",serif;font-size:17px;font-weight:700}
.li span.mut{font-family:system-ui,sans-serif;font-weight:400}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.chips button{background:#fff;color:var(--navy);border:1.5px solid var(--bd)}
.chips button.on{border-color:var(--navy);background:var(--gold-soft)}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--navy);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:560px;width:100%}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:15px 2px 13px;font-size:13px}
nav button.on{color:var(--navy);box-shadow:inset 0 3px 0 var(--gold)}
.b{max-width:80%;padding:9px 13px;border-radius:12px;margin:6px 0;background:var(--soft)}
.b.me{margin-left:auto;background:var(--navy);color:#fff}
.err{color:var(--bad);font-size:14px}.ok{color:var(--ok);font-size:14px}
.demo{background:var(--gold-soft);border-radius:8px;padding:12px;margin-top:14px;color:var(--navy);font-size:14px}
.banner{border-radius:12px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy2));border-bottom:4px solid var(--gold)}
.banner h1{color:#fff;margin:2px 0 4px}.banner p{margin:0;color:#e8eef8;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px 6px;text-align:center}
.stat b{display:block;font:700 22px Georgia,serif;color:var(--navy)}.stat span{font-size:12px;color:var(--mut)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.qa button{background:#fff;color:var(--navy);border:1px solid var(--bd);border-bottom:3px solid var(--gold);padding:15px 8px}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;line-height:18px}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fx{animation:up .3s ease both}
@media (prefers-reduced-motion:reduce){.fx{animation:none}}
.link{background:none;color:var(--mut);font-weight:500;text-decoration:underline;margin-top:26px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const ST=u=>u&&(u.role==="teacher"||u.role==="principal");
function seed(){return{schools:[{id:1,name:"Sethong primary school"},{id:2,name:"Matokane secondary"},{id:3,name:"Boke Agricultural high school"}],
users:[{id:1,school:1,name:"Ms Dlamini",email:"t@demo.com",pw:"demo",role:"teacher",ok:true},
{id:2,school:1,name:"Mr Khumalo",email:"p@demo.com",pw:"demo",role:"principal",ok:true},
{id:3,school:1,name:"Priya Naidoo",email:"parent@demo.com",pw:"demo",role:"parent",ok:true,code:"EL-1001"},
{id:4,school:1,name:"Aiden Naidoo",email:"s@demo.com",pw:"demo",role:"student",ok:true,code:"EL-1001"}],
learners:[{school:1,code:"EL-1001",name:"Aiden Naidoo",grade:"Grade 5",att:"96%",marks:"Maths 78%, English 71%, Science 84%",note:"Great progress in Science."},
{school:1,code:"EL-1002",name:"Zoe Peters",grade:"Grade 5",att:"91%",marks:"Maths 66%, English 80%, Science 70%",note:"Needs support with fractions."}],
msgs:[],ann:[{school:1,title:"Welcome to EduLynx",body:"Use this app for messages, meetings and school notices.",by:"Mr Khumalo",t:Date.now()}],meets:[],alerts:[],n:10}}
function load(){try{const x=localStorage.getItem("el1");if(x)return JSON.parse(x)}catch(e){}return seed()}
function save(){try{localStorage.setItem("el1",JSON.stringify(S))}catch(e){}}
let S=load(),me=null,step="school",school=null,mode="in",role="parent",tab="home",peer=null,err="",ok="",q="";
const $=id=>document.getElementById(id);
const e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const R=()=>{err="";ok=""};
let fx=0;
const TH={1:{navy:"#27364d",navy2:"#3e5470",gold:"#4aa3d8",soft:"#e3f1fa",motto:"Together we can"},2:{navy:"#0e4f5c",navy2:"#1b7384",gold:"#e8b923",soft:"#fbf1cc",motto:""},3:{navy:"#0b5a2b",navy2:"#17803f",gold:"#3dbd6e",soft:"#e4f5ea",motto:""}};
function applyTheme(s){const t=(s&&TH[s.id])||{navy:"#0a1f44",navy2:"#17356f",gold:"#c29b40",soft:"#f6efdc"},r=document.documentElement.style;r.setProperty("--navy",t.navy);r.setProperty("--navy2",t.navy2);r.setProperty("--gold",t.gold);r.setProperty("--gold-soft",t.soft);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t.navy}
const MARK='<svg width="40" height="40" viewBox="0 0 44 44" fill="none" stroke="#c29b40" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 32h36M8 32V22M36 32V22M8 22Q22 2 36 22M15 32v-8M22 32v-12M29 32v-8"/></svg>';
function hero(t,s,back){return `<div class="hero">${back||MARK}<h1>${t}</h1>${s?`<p>${s}</p>`:""}</div>`}
function go(){const a=$("app");a.innerHTML=view();const m=$("th");if(m)m.scrollTop=m.scrollHeight}
function view(){
 if(adm)return admin();
 if(!me){
  if(step==="school"){const l=S.schools.filter(s=>s.name.toLowerCase().includes(q.toLowerCase()));
   return hero("EduLynx","One secure bridge between your school and its community.")+`<div class="pg"><h2>Choose your school</h2><input id="sq" placeholder="Search for your school" value="${e(q)}" oninput="q=this.value;go();$('sq').focus();$('sq').setSelectionRange(q.length,q.length)">${l.map(s=>`<button class="li" onclick="pick(${s.id})">${e(s.name)}<span class="mut">Select</span></button>`).join("")||'<p class="mut">No registered school found.</p>'}<div style="text-align:center"><button class="link" onclick="step='owner';R();go()">Owner console</button></div></div>`}
  if(step==="owner")return ownerLogin();
  if(step==="pending")return hero("Awaiting approval","")+`<div class="pg"><div class="card">Your ${e(role)} account at <b>${e(school.name)}</b> must be approved by the school before you can see staff information.</div><button class="g w" onclick="approveDemo()">Demo: simulate school approval</button><button class="g w" style="margin-top:8px" onclick="out()">Back</button></div>`;
  return hero(mode==="in"?"Sign in":"Create account",e(school.name)+(TH[school.id]?.motto?" · "+e(TH[school.id].motto):""),`<button class="back" onclick="step='school';R();go()">← Change school</button>`)+`<div class="pg">
  <div class="row"><button class="${mode==="in"?"":"g"}" style="flex:1" onclick="mode='in';R();go()">Sign in</button><button class="${mode==="up"?"":"g"}" style="flex:1" onclick="mode='up';R();go()">Create account</button></div>
  ${mode==="up"?`<input id="nm" placeholder="Full name" style="margin-top:14px"><h3 style="margin-top:12px">Choose your role</h3><div class="chips">${["parent","student","teacher","principal"].map(r=>`<button class="${role===r?"on":""}" onclick="setRole('${r}')">${{parent:"Parent",student:"Student",teacher:"Teacher",principal:"Principal"}[r]}</button>`).join("")}</div>${ST({role})?'<p class="mut">Staff accounts need school approval.</p>':'<p class="mut">The school will link your account to the learner’s record.</p>'}`:""}
  <input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <div class="err">${e(err)}</div><button class="w" style="margin-top:6px" onclick="auth()">${mode==="in"?"Sign in":"Create account"}</button>
  <div class="demo">Demo logins (password <b>demo</b>):<br>p@demo.com principal · t@demo.com teacher<br>parent@demo.com · s@demo.com</div></div>`}
 if(me.role==="teacher"&&school.paid===false)return hero("Access suspended","")+`<div class="pg"><div class="card">${e(school.name)}’s subscription is unpaid, so teacher access is switched off. Please ask your principal to renew it.</div><button class="g w" onclick="out()">Sign out</button></div>`;
 const T=[["home","Home"],["msg","Messages"],["meet","Meetings"],["rec","Records"],["sos","Help"]];if(me.role==="principal")T.push(["mng","Manage"]);
 const body={home:home,msg:msgs,meet:meets,rec:recs,sos:sos,mng:mng}[tab](),f=fx,bd={meet:S.meets.filter(m=>m.b===me.id&&m.s==="pending").length,mng:S.users.filter(u=>u.school===school.id&&!u.ok).length};fx=0;
 return `<header class="bar"><div><div class="sch">${e(school.name)}</div><div class="who">${e(me.name)} <span class="tag">${me.role}</span></div></div><button class="o" onclick="out()">Sign out</button></header><main class="pg${f?" fx":""}">${body}</main><nav><div>${T.map(t=>`<button class="${tab===t[0]?"on":""}" onclick="tab='${t[0]}';peer=null;fx=1;R();go()">${t[1]}${bd[t[0]]?`<span class="badge">${bd[t[0]]}</span>`:""}</button>`).join("")}</div></nav>`}
let keepv={};function keep(){keepv={nm:$("nm")?.value,em:$("em")?.value}}
function setRole(r){keep();role=r;go();if(keepv.nm&&$("nm"))$("nm").value=keepv.nm;if(keepv.em&&$("em"))$("em").value=keepv.em}
function pick(id){school=S.schools.find(s=>s.id===id);applyTheme(school);step="auth";R();go()}
function auth(){const em=$("em").value.trim().toLowerCase(),pw=$("pw").value;R();
 if(!em||!pw){err="Enter your email and password.";return go()}
 if(mode==="in"){const u=S.users.find(u=>u.school===school.id&&u.email===em&&u.pw===pw);if(!u){err="Wrong email or password.";return go()}
  if(!u.ok){role=u.role;me=null;pend=u;step="pending";return go()}me=u;tab="home";return go()}
 const nm=$("nm").value.trim();if(!nm){err="Enter your full name.";return go()}
 if(S.users.some(u=>u.school===school.id&&u.email===em)){err="That email is already registered.";return go()}
 if(role==="principal"&&S.users.some(u=>u.school===school.id&&u.role==="principal")){err="This school already has a principal. Ask the school owner for help.";return go()}
 if(pw.length<4){err="Use a longer password.";return go()}
 const u={id:S.n++,school:school.id,name:nm,email:em,pw,role,ok:!ST({role})};S.users.push(u);save();
 if(u.ok){me=u;tab="home"}else{pend=u;step="pending"}go()}
let pend=null;
function approveDemo(){pend.ok=true;save();me=pend;tab="home";go()}
function out(){me=null;step="school";q="";school=null;applyTheme(null);R();go()}
function mine(){return S.learners.filter(l=>l.school===school.id&&(ST(me)||l.code===me.code))}
function home(){const A=S.ann.filter(a=>a.school===school.id).sort((a,b)=>b.t-a.t);
 const al=ST(me)?S.alerts.filter(a=>a.school===school.id).slice(-3).reverse():[];
 const L=mine(),pm=S.meets.filter(m=>m.b===me.id&&m.s==="pending").length,pa=S.users.filter(u=>u.school===school.id&&!u.ok).length,hr=new Date().getHours(),mo=TH[school.id]?.motto;
 const st=ST(me)?[[S.learners.filter(l=>l.school===school.id).length,"Learners"],[pm,"Meeting requests"],me.role==="principal"?[pa,"Awaiting approval"]:[A.length,"Notices"]]:[[L[0]?.att||"–","Attendance"],[pm,"Meeting requests"],[A.length,"Notices"]];
 return `<div class="banner"><p>${hr<12?"Good morning":hr<18?"Good afternoon":"Good evening"}</p><h1>${e(me.name.split(" ")[0])}</h1><p>${e(school.name)}${mo?" · "+e(mo):""}</p></div><div class="stats">${st.map(x=>`<div class="stat"><b>${e(x[0])}</b><span>${x[1]}</span></div>`).join("")}</div><div class="qa">${[["msg","Messages"],["meet","Meetings"],["rec","Records"],["sos","Help &amp; safety"]].map(x=>`<button onclick="tab='${x[0]}';peer=null;fx=1;R();go()">${x[1]}</button>`).join("")}</div>${al.map(a=>`<div class="card alr"><b>Alert: ${e(a.type)}</b><div class="mut">${e(a.from)} · ${new Date(a.t).toLocaleString()}</div>${e(a.note)}</div>`).join("")}<h2>Announcements</h2>${A.map(a=>`<div class="card ann"><h3>${e(a.title)}</h3>${e(a.body)}<div class="mut" style="margin-top:6px">${e(a.by)} · ${new Date(a.t).toLocaleDateString()}</div></div>`).join("")||'<p class="mut">No announcements yet.</p>'}`}
function contacts(){return S.users.filter(u=>u.school===school.id&&u.id!==me.id&&u.ok&&!(u.role==="teacher"&&school.paid===false)&&(ST(me)||ST(u)))}
function msgs(){if(!peer){return `<h1>Messages</h1><p class="mut">Private, school-approved conversations only.</p>${contacts().map(u=>`<button class="li" onclick="peer=${u.id};go()">${e(u.name)} <span class="tag">${u.role}</span></button>`).join("")}`}
 const p=S.users.find(u=>u.id===peer);const th=S.msgs.filter(m=>(m.a===me.id&&m.b===peer)||(m.a===peer&&m.b===me.id));
 return `<div class="row"><button class="g" onclick="peer=null;go()">←</button><h2 style="margin:0">${e(p.name)}</h2></div><div id="th" style="max-height:52vh;overflow:auto;margin:10px 0">${th.map(m=>`<div class="b ${m.a===me.id?"me":""}">${e(m.x)}</div>`).join("")||'<p class="mut">Start the conversation.</p>'}</div><div class="row"><input id="mi" placeholder="Write a message" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Send</button></div>`}
function send(){const v=$("mi").value.trim();if(!v)return;S.msgs.push({a:me.id,b:peer,x:v,t:Date.now()});save();go();$("mi").focus()}
function meets(){const M=S.meets.filter(m=>m.a===me.id||m.b===me.id);
 return `<h1>Meetings</h1>${M.map(m=>{const o=S.users.find(u=>u.id===(m.a===me.id?m.b:m.a));return `<div class="card"><div class="row sp"><h3>${e(o.name)}</h3><span class="tag">${m.s}</span></div>${new Date(m.when).toLocaleString()}<div class="mut">${e(m.note)}</div>${m.s==="pending"&&m.b===me.id?`<div class="row" style="margin-top:8px"><button onclick="mt(${m.id},'confirmed')">Accept</button><button class="g" onclick="mt(${m.id},'declined')">Decline</button></div>`:""}</div>`}).join("")||'<p class="mut">No meetings yet.</p>'}
 <h2>Request a meeting</h2><div class="card"><select id="mp">${contacts().map(u=>`<option value="${u.id}">${e(u.name)} (${u.role})</option>`).join("")}</select><input id="mw" type="datetime-local"><input id="mn" placeholder="What is it about?"><div class="err">${e(err)}</div><button class="w" onclick="reqm()">Send request</button></div>`}
function reqm(){const w=$("mw").value;R();if(!w){err="Pick a date and time.";return go()}S.meets.push({id:S.n++,a:me.id,b:+$("mp").value,when:w,note:$("mn").value,s:"pending"});save();go()}
function mt(id,s){S.meets.find(m=>m.id===id).s=s;save();go()}
function recs(){const L=mine();return `<h1>${me.role==="parent"?"My child’s record":ST(me)?"Learner records":"My record"}</h1><p class="mut">Only authorised people at this school can see these.</p>${L.map(l=>`<div class="card"><h3>${e(l.name)} · ${e(l.grade)}</h3><div class="mut">Code ${e(l.code)}</div><p>Attendance: <b>${e(l.att)}</b><br>Marks: ${e(l.marks)}<br>Teacher note: ${e(l.note)}</p></div>`).join("")||'<p class="mut">No records linked yet. The school will link your account.</p>'}`}
function sos(){const mineA=S.alerts.filter(a=>a.school===school.id&&a.uid===me.id).slice(-3).reverse();
 return `<h1>Help &amp; safety</h1><div class="card"><select id="at"><option>I need a parent to contact the school</option><option>I need a staff member’s attention</option><option>Emergency – urgent help needed</option></select><input id="an" placeholder="Add a short note (optional)"><button class="d w" onclick="alertSend()">Send alert</button><div class="ok">${e(ok)}</div><p class="mut">Alerts go to school staff${me.role==="student"?" and your linked parent":""} straight away.</p></div>${mineA.map(a=>`<div class="card mut">Sent: ${e(a.type)} · ${new Date(a.t).toLocaleTimeString()}</div>`).join("")}`}
function alertSend(){S.alerts.push({school:school.id,uid:me.id,from:me.name+" ("+me.role+")",type:$("at").value,note:$("an").value,t:Date.now()});save();R();ok="Alert sent. Help is on the way.";go()}
function mng(){const P=S.users.filter(u=>u.school===school.id&&!u.ok),U=S.users.filter(u=>u.school===school.id&&u.ok&&!ST(u)&&!u.code),L=S.learners.filter(l=>l.school===school.id);
 return `<h1>Manage school</h1><h2>Subscription</h2><div class="card"><b>${school.paid===false?"Unpaid":"Active"}</b><p class="mut">If the monthly fee isn’t paid, teachers lose access to the app until payment is made.</p><button class="w ${school.paid===false?"":"d"}" onclick="pay(${school.paid===false})">${school.paid===false?"Demo: pay now":"Demo: simulate missed payment"}</button></div><h2>Staff awaiting approval</h2>${P.map(u=>`<div class="card row sp"><div><b>${e(u.name)}</b><div class="mut">${u.role} · ${e(u.email)}</div></div><button onclick="appr(${u.id})">Approve</button></div>`).join("")||'<p class="mut">Nobody waiting.</p>'}<h2>Link accounts to learners</h2>${U.map(u=>`<div class="card"><b>${e(u.name)}</b> <span class="tag">${u.role}</span><select id="lk${u.id}">${L.map(l=>`<option value="${l.code}">${e(l.name)}</option>`).join("")}</select><button class="w" onclick="lnk(${u.id})">Link</button></div>`).join("")||'<p class="mut">All accounts are linked.</p>'}<h2>Post announcement</h2><div class="card"><input id="ht" placeholder="Title"><textarea id="hb" rows="3" placeholder="Message to the whole school"></textarea><button class="w" onclick="post()">Publish</button></div>`}
function lnk(id){S.users.find(u=>u.id===id).code=$("lk"+id).value;save();go()}
function pay(v){school.paid=v;save();go()}
const OWNER='owner123';let adm=false,at='over',ed=null,el=-1,rc=false,dc=null,ex='';
window.onerror=m=>{try{(S.errors=S.errors||[]).push({m:String(m),t:Date.now()});save()}catch(x){}};
const sc=id=>S.schools.find(s=>s.id===id),sn=id=>sc(id)?.name||'?';
function ownerLogin(){return hero("Owner console","Restricted to the EduLynx owner.",`<button class="back" onclick="step='school';R();go()">← Back</button>`)+`<div class="pg"><input id='op' type='password' placeholder='Owner passcode'><div class='err'>${e(err)}</div><button class='w' onclick='ownIn()'>Open</button></div>`}
function ownIn(){if($('op').value===OWNER){adm=true;at='over';R();go()}else{err='Wrong passcode.';go()}}
function admin(){const T=[['over','Overview'],['usr','Users'],['lrn','Learners'],['chk','Checks'],['log','Logs']];const B={over:aOver,usr:aUsr,lrn:aLrn,chk:aChk,log:aLog}[at]();return `<header class='bar'><div class='sch'>Owner console</div><button class='o' onclick="adm=false;step='school';go()">Exit</button></header><div class='pg'><div class='row' style='flex-wrap:wrap'>${T.map(t=>`<button class='${at===t[0]?'':'g'}' onclick="at='${t[0]}';ed=null;el=-1;R();go()">${t[1]}</button>`).join('')}</div>${B}</div>`}
function aOver(){return `<div class='stats'><div class='stat'><b>${S.schools.length}</b><span>Schools</span></div><div class='stat'><b>${S.users.length}</b><span>Users</span></div><div class='stat'><b>${S.schools.filter(s=>s.paid!==false).length}</b><span>Active plans</span></div></div><p class='mut'>Message contents are never shown here, to protect families’ privacy.</p>`+S.schools.map(s=>{const U=S.users.filter(u=>u.school===s.id),r=x=>U.filter(u=>u.role===x).length,ids=U.map(u=>u.id);return `<div class='card'><div class='row sp'><h3>${e(s.name)}</h3><span class='tag'>${s.paid===false?'Unpaid':'Active'}</span></div><p class='mut'>Principals ${r('principal')} · Teachers ${r('teacher')} · Parents ${r('parent')} · Students ${r('student')}<br>Pending approval ${U.filter(u=>!u.ok).length} · Learners ${S.learners.filter(l=>l.school===s.id).length}<br>Messages ${S.msgs.filter(m=>ids.includes(m.a)).length} · Meetings ${S.meets.filter(m=>ids.includes(m.a)).length} · Alerts ${S.alerts.filter(a=>a.school===s.id).length}</p><button class='g w' onclick='sp(${s.id})'>${s.paid===false?'Mark as paid':'Mark as unpaid'}</button></div>`}).join('')+`<div class='card'><button class='g w' onclick='tx()'>${ex?'Hide':'Show'} data export</button>${ex?`<textarea rows='8' readonly>${e(ex)}</textarea>`:''}<button class='d w' style='margin-top:8px' onclick='rs()'>${rc?'Tap again to erase everything':'Reset all demo data'}</button></div>`}
function sp(id){const s=sc(id);s.paid=s.paid===false;save();go()}
function tx(){ex=ex?'':JSON.stringify({...S,users:S.users.map(({pw,...u})=>u)},null,1);go()}
function rs(){if(!rc){rc=true;return go()}S=seed();save();rc=false;go()}
function aUsr(){return S.users.map(u=>ed===u.id?`<div class='card'><input id='en' value='${e(u.name)}'><input id='ee' value='${e(u.email)}'><select id='er'>${['parent','student','teacher','principal'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select><div class='err'>${e(err)}</div><div class='row'><button onclick='usv(${u.id})'>Save</button><button class='g' onclick='ed=null;R();go()'>Cancel</button></div></div>`:`<div class='card'><div class='row sp'><b>${e(u.name)}</b><span class='tag'>${u.role}</span></div><div class='mut'>${e(u.email)} · ${e(sn(u.school))}${u.code?' · '+e(u.code):''}<br>${u.ok?'Approved':'Not approved'}</div><div class='row' style='flex-wrap:wrap;margin-top:8px'><button class='g' onclick='ed=${u.id};R();go()'>Edit</button>${u.ok?'':`<button onclick='uap(${u.id})'>Approve</button>`}<button class='g' onclick='upw(${u.id})'>Reset password</button><button class='d' onclick='udl(${u.id})'>${dc===u.id?'Tap again':'Delete'}</button></div></div>`).join('')+`<div class='ok'>${e(ok)}</div>`}
function usv(id){const u=S.users.find(x=>x.id===id),n=$('en').value.trim(),m=$('ee').value.trim().toLowerCase();R();if(!n||!m){err='Name and email are required.';return go()}if(S.users.some(x=>x.id!==id&&x.school===u.school&&x.email===m)){err='Email already used at this school.';return go()}u.name=n;u.email=m;u.role=$('er').value;save();ed=null;go()}
function uap(id){S.users.find(u=>u.id===id).ok=true;save();go()}
function upw(id){const u=S.users.find(x=>x.id===id);u.pw='temp1234';save();R();ok='Temporary password for '+u.name+': temp1234';go()}
function udl(id){if(dc!==id){dc=id;return go()}S.users=S.users.filter(u=>u.id!==id);S.msgs=S.msgs.filter(m=>m.a!==id&&m.b!==id);S.meets=S.meets.filter(m=>m.a!==id&&m.b!==id);dc=null;save();go()}
function aLrn(){return `<p class='mut'>Learner records are sensitive. Only edit them to fix mistakes.</p>`+S.learners.map((l,i)=>el===i?`<div class='card'><input id='ln' value='${e(l.name)}'><input id='lg' value='${e(l.grade)}'><input id='la' value='${e(l.att)}'><input id='lm' value='${e(l.marks)}'><input id='lt' value='${e(l.note)}'><div class='row'><button onclick='lsv(${i})'>Save</button><button class='g' onclick='el=-1;go()'>Cancel</button></div></div>`:`<div class='card'><div class='row sp'><h3>${e(l.name)}</h3><span class='tag'>${e(l.code)}</span></div><div class='mut'>${e(sn(l.school))} · ${e(l.grade)} · ${e(l.att)}<br>${e(l.marks)}<br>${e(l.note)}</div><button class='g' style='margin-top:8px' onclick='el=${i};go()'>Edit</button></div>`).join('')}
function lsv(i){const l=S.learners[i];l.name=$('ln').value;l.grade=$('lg').value;l.att=$('la').value;l.marks=$('lm').value;l.note=$('lt').value;save();el=-1;go()}
function aChk(){const c=[],seen={};S.users.forEach(u=>{const k=u.school+'|'+u.email;if(seen[k])c.push('Duplicate email: '+u.email+' at '+sn(u.school));seen[k]=1;if((u.role==='parent'||u.role==='student')&&u.ok&&!u.code)c.push(u.name+' ('+u.role+') has no linked learner');if(u.code&&!S.learners.some(l=>l.school===u.school&&l.code===u.code))c.push(u.name+' is linked to a missing learner ('+u.code+')');if(!u.ok)c.push(u.name+' ('+u.role+') is waiting for approval');if(u.role==='teacher'&&sc(u.school)?.paid===false)c.push(u.name+' is locked out (unpaid school)')});S.meets.forEach(m=>{if(!S.users.some(u=>u.id===m.a)||!S.users.some(u=>u.id===m.b))c.push('A meeting refers to a deleted user')});S.schools.forEach(s=>{if(!S.users.some(u=>u.school===s.id&&u.role==='principal'&&u.ok))c.push(s.name+' has no approved principal')});return `<p class='mut'>Automatic checks for common mistakes.</p>`+(c.map(x=>`<div class='card'>${e(x)}</div>`).join('')||`<div class='card'>No problems found.</div>`)}
function aLog(){const E=(S.errors||[]).slice(-20).reverse();return `<h2>App errors</h2>${E.map(x=>`<div class='card'><b>${e(x.m)}</b><div class='mut'>${new Date(x.t).toLocaleString()}</div></div>`).join('')||`<p class='mut'>No errors recorded.</p>`}${E.length?`<button class='g' onclick='S.errors=[];save();go()'>Clear errors</button>`:''}<h2>Alerts</h2>${S.alerts.slice(-20).reverse().map(a=>`<div class='card'><b>${e(a.type)}</b><div class='mut'>${e(a.from)} · ${e(sn(a.school))} · ${new Date(a.t).toLocaleString()}</div>${e(a.note)}</div>`).join('')||`<p class='mut'>No alerts.</p>`}`}
function appr(id){S.users.find(u=>u.id===id).ok=true;save();go()}
function post(){const t=$("ht").value.trim(),b=$("hb").value.trim();if(!t||!b)return;S.ann.push({school:school.id,title:t,body:b,by:me.name,t:Date.now()});save();tab="home";go()}
go();
</script>
</body>
</html>
